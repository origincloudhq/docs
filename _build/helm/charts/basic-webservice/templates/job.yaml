{{- $fullName := include "basic-webservice.fullname" . -}}
{{- $image := include "basic-webservice.fullname" . -}}

{{- range .Values.preInstallJobs }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-{{ .name }}
  labels:
    {{- include "basic-webservice.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      name: {{ $fullName }}-{{ .name }}
    spec:
      restartPolicy: Never
      containers:
        - name: {{ $fullName }}-{{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          {{- if .command }}
          command: [ "{{ .command }}" ]
          {{- end }}
          env:
          {{- range $key, $val := $.Values.env_variables.data }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
          {{- end }}
          {{- range $key, $val := $.Values.secrets.data }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  key: {{ $key | quote }}
                  name: {{ include "basic-webservice.jobSecretName" $ }}
          {{- end }}

---
{{- end }}
