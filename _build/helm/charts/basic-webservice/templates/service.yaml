apiVersion: v1
kind: Service
metadata:
  name: {{ include "basic-webservice.fullname" . }}
  labels:
    {{- include "basic-webservice.labels" . | nindent 4 }}
#  annotations:
#    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 10080
      protocol: TCP
      name: http
  selector:
    {{- include "basic-webservice.selectorLabels" . | nindent 4 }}
