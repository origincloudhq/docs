{{- if and .Values.secrets.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "basic-webservice.runtimeSecretName" . }}
data:
{{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- end }}

{{- if .Values.mounted_secrets.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-files
data:
{{- range $key, $value := .Values.mounted_secrets.data }}
  {{ $key }}: {{ $value }}
{{- end }}
{{- end }}
