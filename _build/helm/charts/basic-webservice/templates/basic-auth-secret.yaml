{{- if and .Values.ingress.enabled .Values.ingress.basicAuth.enabled .Values.ingress.basicAuth.secret.create -}}
{{- if or (empty .Values.ingress.basicAuth.username) (empty .Values.ingress.basicAuth.password) -}}
{{- fail "ingress.basicAuth.username and ingress.basicAuth.password are required when ingress.basicAuth.secret.create=true" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "basic-webservice.basicAuthSecretName" . }}
  labels:
    {{- include "basic-webservice.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ htpasswd .Values.ingress.basicAuth.username .Values.ingress.basicAuth.password | b64enc }}
{{- end }}
