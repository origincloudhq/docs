{{/*
A runtime config.json mounted over the image's baked-in copy.

Opt-in, and off by default: where something else owns the ConfigMap, the
chart must not create a competing copy. This site has no runtime
configuration and leaves it off.
*/}}
{{- if .Values.runtimeConfig.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.runtimeConfig.name | default (printf "%s-runtime-config" .Release.Name) | quote }}
  labels:
    {{- include "basic-webservice.labels" . | nindent 4 }}
data:
  config.json: |
    {{- toJson .Values.runtimeConfig.data | nindent 4 }}
{{- end }}
