{{/*
The registry credential for pulling this app's own image.

For an image in a private GHCR package, without this the pod fails
with `401 Unauthorized` on the anonymous token - and the reference to it in
`imagePullSecrets` is satisfied by nothing, so the only symptom is
ImagePullBackOff plus a `FailedToRetrieveImagePullSecret` warning.

Opt-in and off by default: a public package needs no credential.

The credential is NEVER committed. `dockerconfigjson` is passed at deploy
time from a GitHub secret (see .github/workflows/cd.yml), so the value lives
in exactly one place and rotating it is a secret update plus a redeploy. If
it is empty the object is not rendered at all, rather than creating a Secret
holding "" that would fail the pull in a harder-to-read way.
*/}}
{{- if and .Values.imagePullSecret.create .Values.imagePullSecret.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name | quote }}
  labels:
    {{- include "basic-webservice.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
