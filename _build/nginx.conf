server {
    # 10080, not 80: the shared basic-webservice Helm chart hardcodes
    # Service targetPort: 10080, so the container must listen there too.
    listen 10080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Emit relative Location headers. This container listens on 10080 behind
    # the ingress, and nginx would otherwise build redirects from its own
    # scheme and listen port — `http://docs.origincloud.eu:10080/docs/`, which
    # is both the wrong scheme and a port nothing serves publicly. Relative
    # means the browser resolves against the URL it actually requested.
    absolute_redirect off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml font/woff2;

    # nginx's mime.types has no .md. A second types block adds to the first,
    # so this keeps every other type.
    include /etc/nginx/mime.types;
    types { text/markdown md; }

    # The Markdown version of every page (index.html.md) and the llms*.txt
    # files are UTF-8; nginx would send them without a charset. The Markdown
    # versions and llms-full.txt repeat the pages, so they are never indexed:
    # the HTML is the page search engines should show, as on origincloud.eu.
    charset_types text/plain text/markdown;
    location ~ \.md$ {
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
    }
    location ~ (?:^|/)llms-full\.txt$ {
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /llms.txt {
        charset utf-8;
    }

    # Astro emits content-hashed assets under /_astro/, so they are safe to
    # cache hard. Everything else stays short-lived.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pagefind's index fragments are rebuilt on every deploy and are requested
    # by the search UI, not by the document itself.
    location /pagefind/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything this site serves lives under /docs/, so the whole property
    # can be split from origincloud.eu by path as well as by hostname (they
    # share one GA4 container). A real 301 rather than Astro's meta-refresh
    # page: it passes link equity, and analytics records one pageview at the
    # destination instead of two.
    location = / {
        return 301 /docs/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
